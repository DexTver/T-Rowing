<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Тренеры')}"></head>
<body>
<header th:replace="~{fragments/common :: nav}"></header>

<main>
    <p class="crumbs"><a th:href="@{/admin}">← Админка</a></p>
    <h1>Тренеры</h1>
    <p th:if="${ok}" th:text="${ok}" class="status"></p>
    <p th:if="${error}" th:text="${error}" class="error"></p>

    <h2>Добавить тренера</h2>
    <form method="post" th:action="@{/admin/coaches}" class="stack">
        <input type="text" name="fullName" placeholder="ФИО тренера" required>
        <select name="userId">
            <option value="">— без учётной записи —</option>
            <option th:each="o : ${userOptions}" th:value="${o.id}" th:text="${o.label}"></option>
        </select>
        <button type="submit">Добавить</button>
    </form>

    <h2>Список</h2>
    <table class="grid">
        <thead>
        <tr><th>ФИО</th><th>Учётная запись</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${coaches}">
            <td colspan="2">
                <form method="post" th:action="@{/admin/coaches/{id}(id=${c.id})}" class="inline">
                    <input type="text" name="fullName" th:value="${c.fullName}" required>
                    <select name="userId">
                        <option value="">— без учётной записи —</option>
                        <option th:each="o : ${userOptions}" th:value="${o.id}" th:text="${o.label}"
                                th:selected="${o.label == c.userLogin}"></option>
                    </select>
                    <button type="submit">Сохранить</button>
                </form>
            </td>
            <td>
                <form method="post" th:action="@{/admin/coaches/{id}/delete(id=${c.id})}" class="inline"
                      onsubmit="return confirm('Удалить тренера?');">
                    <button type="submit">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
