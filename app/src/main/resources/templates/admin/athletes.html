<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Спортсмены')}"></head>
<body>
<header th:replace="~{fragments/common :: nav}"></header>

<main>
    <p class="crumbs"><a th:href="@{/admin}">← Админка</a></p>
    <h1>Спортсмены</h1>
    <p th:if="${ok}" th:text="${ok}" class="ok"></p>
    <p th:if="${error}" th:text="${error}" class="error"></p>
    <p class="muted">Новые спортсмены добавляются тренерами; здесь — правка и удаление.</p>

    <table class="grid">
        <thead>
        <tr><th>ФИО</th><th>Г.р.</th><th>Разряд</th><th>Субъект</th><th>Школа</th><th>Тренер</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="a : ${athletes}">
            <td colspan="6">
                <form method="post" th:action="@{/admin/athletes/{id}(id=${a.id})}" class="inline">
                    <input type="text" name="fullName" th:value="${a.fullName}" required>
                    <input type="number" name="birthYear" th:value="${a.birthYear}" style="width:5rem" required>
                    <input type="text" name="rank" th:value="${a.rank}" placeholder="разряд" style="width:5rem">
                    <input type="text" name="region" th:value="${a.region}" placeholder="субъект">
                    <input type="text" name="school" th:value="${a.school}" placeholder="школа">
                    <select name="coachId">
                        <option value="">— без тренера —</option>
                        <option th:each="o : ${coachOptions}" th:value="${o.id}" th:text="${o.label}"
                                th:selected="${a.coachId != null and o.id == a.coachId}"></option>
                    </select>
                    <button type="submit">Сохранить</button>
                </form>
            </td>
            <td>
                <form method="post" th:action="@{/admin/athletes/{id}/delete(id=${a.id})}" class="inline"
                      onsubmit="return confirm('Удалить спортсмена?');">
                    <button type="submit">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
