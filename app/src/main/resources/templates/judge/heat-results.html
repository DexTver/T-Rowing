<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Ввод результатов')}"></head>
<body>
<header th:replace="~{fragments/common :: nav}"></header>

<main>
    <p class="crumbs">
        <a th:href="@{/judge/categories/{id}(id=${heat.categoryId})}">← <span th:text="${heat.categoryName}">категория</span></a>
    </p>
    <h1>Заезд № <span th:text="${heat.number}">1</span></h1>
    <p class="status" th:text="${heat.label}">этап</p>

    <p th:if="${error}" class="error" th:text="${error}">ошибка</p>

    <div class="cols">
        <div>
            <h3>Дорожки</h3>
            <table class="grid">
                <thead><tr><th>Дорожка</th><th>Спортсмен</th><th>Текущий</th></tr></thead>
                <tbody>
                <tr th:each="l : ${heat.lanes}">
                    <td th:text="${l.lane}">1</td>
                    <td th:text="${l.athleteName}">ФИО</td>
                    <td th:text="${l.value}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div>
            <h3>Быстрый ввод</h3>
            <p class="muted">Построчно: <code>дорожка время</code>. Время — <code>сс.сс</code> или <code>мм:сс.сс</code>.
                Для схода — <code>DNF</code>/<code>DNS</code>/<code>DSQ</code>.</p>
            <form method="post" th:action="@{/judge/heats/{id}/results(id=${heat.id})}">
                <input type="hidden" name="categoryId" th:value="${heat.categoryId}">
                <textarea name="input" rows="12" cols="28" th:text="${prefill}"></textarea>
                <div><button type="submit">Сохранить результаты</button></div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
