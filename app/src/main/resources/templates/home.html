<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Соревнования — Гребная база')}"></head>
<body>
<header th:replace="~{fragments/common :: nav}"></header>

<main>
    <h1>Соревнования</h1>

    <p th:if="${competitions.isEmpty()}" class="muted">Пока нет ни одного соревнования.</p>

    <table th:unless="${competitions.isEmpty()}" class="grid">
        <thead>
        <tr>
            <th>Соревнование</th>
            <th>Статус</th>
            <th>Дата</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${competitions}" th:classappend="${c.live} ? 'live'">
            <td><a th:href="@{/competitions/{id}(id=${c.id})}" th:text="${c.name}">Соревнование</a></td>
            <td><span th:text="${c.statusLabel}">статус</span></td>
            <td th:text="${c.startsAt}">дата</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
